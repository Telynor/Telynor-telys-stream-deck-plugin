<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tely's Stream Deck Integration</title>
  <link rel="stylesheet" href="inspector.css">
</head>
<body>
  <section id="connection-settings" hidden>
    <h3>Plugin Connection Settings</h3>
    <label>Pairing secret<input id="secret" type="password" autocomplete="off"></label>
    <small>This secret is saved once and shared by every Tely's Integration action.</small>
  </section>
  <section id="action-settings">
    <label>Foundry user<select id="user"></select></label>
    <label>Action<select id="action"></select></label>
    <label>Document or token UUID<input id="uuid" placeholder="Actor.x, Macro.x, Scene.x.Token.x"></label>
    <label>Advanced payload<textarea id="payload" rows="7" spellcheck="false">{}</textarea></label>
  </section>
  <p id="status">Waiting for Foundry…</p>
  <script src="inspector.js"></script>
</body>
</html>
